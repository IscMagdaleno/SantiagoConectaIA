name: Deploy .NET API to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Find and Build API Project
        shell: pwsh
        run: |
          # Busca específicamente el proyecto de la API dentro del monorepo
          $projFile = Get-ChildItem -Recurse -Filter "SantiagoConectaIA.API.csproj" | Select-Object -First 1
          if (-not $projFile) {
              Write-Error "No se encontró el archivo de proyecto SantiagoConectaIA.API.csproj"
              exit 1
          }
          Write-Host "Proyecto encontrado: $($projFile.FullName)"
          dotnet publish $projFile.FullName -c Release -o ./publish_output

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SantiagoConectaIAAPI'
          package: ./publish_output
